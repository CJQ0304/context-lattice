name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: 验收集（${{ matrix.os }} / Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 零第三方依赖：核心验收集只用标准库。
      - name: 运行验收集
        run: python tests/test_all.py

      - name: 冒烟（各类视图与错误路径逐条打印）
        run: python tests/smoke.py
